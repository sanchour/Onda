    <style>
      html,body{margin:0;background:#F5F1E8}
      @media (prefers-color-scheme:dark){html[data-theme="auto"],html[data-theme="auto"] body{background:#1B1C1F}}
      html[data-theme="dark"],html[data-theme="dark"] body{background:#1B1C1F}
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 44px/1 "Newsreader",Georgia,serif;letter-spacing:-.01em;color:#8A8A8E;pointer-events:none;z-index:1}
      html[data-theme="dark"] #boot{color:#6C6C70}
    </style>
    <script>
      // Apply the saved appearance before first paint so there is no flash.
      try {
        var m = localStorage.getItem('onda.theme');
        if (m) document.documentElement.dataset.theme = m === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
        var d = document.documentElement.dataset.theme === 'dark';
        document.querySelector('meta[name=theme-color]').setAttribute('content', d ? '#1B1C1F' : '#F5F1E8');
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">Onda</div>
    <noscript>Onda needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
