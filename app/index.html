    <style>
      html,body{margin:0;background:var(--boot-bg,#F5F1E8)}
      html[data-theme="dark"],html[data-theme="dark"] body{background:var(--boot-bg,#1B1C1F)}
      /* The loading screen: the same three waves as the iOS launch image, at the same size and place. It follows the phone's
         own light or dark mode as it is right now (iOS chose its launch image the same way), on the background the app uses
         in that mode, and fades out when the app is ready. */
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--boot-light,#F5F1E8);color:#0A68D8;pointer-events:none;z-index:1;transition:opacity .22s ease-out,background-color .2s}
      @media (prefers-color-scheme:dark){#boot{background:var(--boot-dark,#1B1C1F);color:#3D94FF}}
      #boot svg{width:22vw;height:22vw;max-width:120px;max-height:120px}
      #boot.out{opacity:0}
      /* The strip iOS samples for the bar behind the clock (see src/app/statusBar.ts). Opaque, fixed to the top edge, above everything. */
      #status-strip{position:fixed;top:0;left:0;right:0;z-index:2147483000;height:env(safe-area-inset-top,0px);background:var(--surface-grouped,var(--boot-bg,#F5F1E8));pointer-events:none}
      @supports (-webkit-touch-callout:none){#status-strip{height:max(env(safe-area-inset-top,0px),6px);pointer-events:auto}}
    </style>
    <script>
      // Apply the saved appearance and background before first paint. iOS colours the bar behind the clock and
      // battery from the page as it is when it loads, so the right colour has to be here already (see src/app/statusBar.ts).
      (function () {
        var root = document.documentElement, m = 'auto', bg = null;
        try { m = localStorage.getItem('onda.theme') || 'auto'; } catch (e) {}
        var d = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = d ? 'dark' : 'light';
        try { bg = localStorage.getItem(d ? 'onda.bg.dark' : 'onda.bg.light'); } catch (e) {}
        if (!/^#[0-9a-fA-F]{6}$/.test(bg || '')) bg = d ? '#1B1C1F' : '#F5F1E8';
        root.style.setProperty('--boot-bg', bg);
        // the loading screen has a colour for each mode of the phone (see #boot above)
        ['light', 'dark'].forEach(function (k) {
          var v = null;
          try { v = localStorage.getItem('onda.bg.' + k); } catch (e) {}
          if (/^#[0-9a-fA-F]{6}$/.test(v || '')) root.style.setProperty('--boot-' + k, v);
        });
        // the app stylesheet paints body with this token, and it loads before the app does
        root.style.setProperty('--surface-grouped', bg);
        root.style.backgroundColor = bg;
        document.querySelector('meta[name=theme-color]').setAttribute('content', bg);
        document.querySelector('meta[name=color-scheme]').setAttribute('content', d ? 'dark' : 'light');
        root.style.colorScheme = d ? 'dark' : 'light';
        // desktop layout (src/lib/desk.ts): known before the first paint so the phone layout never flashes
        if (matchMedia('(min-width: 1100px)').matches) root.dataset.desk = '1';
        // light effects (src/lib/lite.ts), by the same rules: chosen, or a desktop with few cores, little memory or slow frames seen
        try {
          var lm = localStorage.getItem('onda.lite'), nv = navigator;
          if (lm === 'on' || (lm !== 'off' && root.dataset.desk && ((nv.hardwareConcurrency || 8) <= 4 || (nv.deviceMemory || 8) <= 4 || localStorage.getItem('onda.liteSeen') === '1'))) root.dataset.lite = '1';
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <div id="status-strip" aria-hidden="true"></div>
    <div id="boot" aria-hidden="true"><svg viewBox="0 0 512 512" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round"><path d="M132 190c42-34 82-34 124 0s82 34 124 0"/><path d="M132 256c42-34 82-34 124 0s82 34 124 0"/><path d="M132 322c42-34 82-34 124 0s82 34 124 0"/></svg></div>
